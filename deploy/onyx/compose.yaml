# Backend stack — Onyx v5.1.3 (search/memory) + retrieval adapter.
#
#   cp .env.example .env && edit
#   docker compose up -d
#   docker compose --profile ingest run --rm ingest
#
# Endpoints
#   Onyx admin/UI   http://localhost:3000     (create the admin user, API key, index settings)
#   Onyx API        http://localhost:8080
#   retrieval       http://localhost:8082/search?q=...&k=6
#
# Model endpoints are NOT in this file: llama.cpp/llama-swap is provided and tuned
# by the operator. See deploy/llama-swap.example.yaml.

name: mailrag-backend

x-onyx: &onyx
  image: onyxdotapp/onyx-backend:${ONYX_TAG:-v5.1.3}
  env_file:
    - path: .env
      required: false
  environment:
    AUTH_TYPE: basic
    POSTGRES_HOST: relational_db
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    POSTGRES_DB: ${POSTGRES_DB:-postgres}
    OPENSEARCH_HOST: opensearch
    OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}
    REDIS_HOST: cache
    FILE_STORE_BACKEND: postgres
    CACHE_BACKEND: redis
    DISABLE_MODEL_SERVER: "true"
    USER_AUTH_SECRET: ${USER_AUTH_SECRET:?set USER_AUTH_SECRET in .env}
    WEB_DOMAIN: ${WEB_DOMAIN:-http://localhost:3000}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  relational_db:
    image: docker.io/library/postgres:15.2-alpine
    command: -c 'max_connections=250'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - db_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  opensearch:
    image: docker.io/opensearchproject/opensearch:3.6.0
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - ${OPENSEARCH_DATA_DIR:-./opensearch-data}:/usr/share/opensearch/data
    healthcheck:
      # the security plugin serves HTTPS only; plain HTTP trips NotSslRecordException
      test: ["CMD-SHELL", "curl -skf -u admin:${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!} https://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  cache:
    image: docker.io/library/redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api_server:
    <<: *onyx
    command: >
      /bin/sh -c "alembic upgrade head &&
      uvicorn onyx.main:app --host 0.0.0.0 --port 8080"
    depends_on:
      relational_db: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      cache: { condition: service_healthy }
    volumes:
      # POC patch: makes the LiteLLM embedding provider work from search threads
      - ./patches/search_nlp_models.py:/app/onyx/natural_language_processing/search_nlp_models.py:ro
    ports:
      - "${ONYX_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 600s

  background:
    <<: *onyx
    command: >
      /bin/sh -c "/app/scripts/supervisord_entrypoint.sh"
    depends_on:
      relational_db: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      cache: { condition: service_healthy }
      api_server: { condition: service_healthy }

  web_server:
    image: onyxdotapp/onyx-web-server:${ONYX_TAG:-v5.1.3}
    environment:
      INTERNAL_URL: http://api_server:8080
    depends_on:
      api_server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Only entrypoint that makes the Onyx UI work: it proxies /api -> api_server
  # (stripping the prefix) and / -> web_server. Templates vendored from Onyx v5.1.3.
  nginx:
    image: docker.io/library/nginx:1.25.5-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      MCP_SERVER_ENABLED: "false"
    volumes:
      - ./nginx:/nginx-templates:ro
    command: >
      /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf
      && cp -a /nginx-templates/. /etc/nginx/conf.d/
      && sed 's/\r$//' /etc/nginx/conf.d/run-nginx.sh > /tmp/run-nginx.sh
      && chmod +x /tmp/run-nginx.sh
      && /tmp/run-nginx.sh app.conf.template"
    ports:
      - "${ONYX_WEB_PORT:-3000}:80"
    depends_on:
      api_server: { condition: service_healthy }
      web_server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Optional: Onyx's own embedding/rerank servers. Not used when an external
  # embedding provider is configured, but a fresh database creates its default
  # index with the local model. Enable once if first boot complains:
  #   docker compose --profile bundled-models up -d
  inference_model_server:
    <<: *onyx
    image: onyxdotapp/onyx-model-server:${ONYX_TAG:-v5.1.3}
    profiles: ["bundled-models"]
    volumes:
      - model_cache_huggingface:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  indexing_model_server:
    <<: *onyx
    image: onyxdotapp/onyx-model-server:${ONYX_TAG:-v5.1.3}
    profiles: ["bundled-models"]
    volumes:
      - indexing_huggingface_model_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  # Onyx has no reranker since v5.x; this adapter over-fetches from Onyx search
  # and reranks with Qwen3-Reranker-0.6B before returning citation-shaped hits.
  retrieval:
    build:
      context: ../../services/retrieval
    environment:
      ONYX_URL: http://api_server:8080
      ONYX_API_KEY: ${ONYX_API_KEY:-}
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USER: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}
      INDEX_NAME: ${INDEX_NAME:-danswer_chunk_mail_qwen3_06b_v2}
      EMBED_URL: ${EMBED_URL:-http://host.docker.internal:9292/v1/embeddings}
      EMBED_MODEL: ${EMBED_MODEL:-mail-qwen3-embedding-0.6b}
      RERANK_URL: ${RERANK_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-mail-qwen3-reranker-0.6b}
      CANDIDATES: ${CANDIDATES:-30}
      DATA_DIR: /data
    volumes:
      - ${DATA_DIR:-../../data}:/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - mailrag
    ports:
      - "${RETRIEVAL_PORT:-8082}:8082"
    depends_on:
      api_server: { condition: service_healthy }
    restart: unless-stopped

  # One-shot ingest. Needs an Onyx API key (Admin → API Keys, scope manage:connectors)
  # and a configured index (Nemotron-3-Embed-1B, 2048 dims) in the admin UI first.
  ingest:
    build:
      context: ../..
      dockerfile: services/ingest/Dockerfile
    profiles: ["ingest"]
    environment:
      ONYX_URL: http://api_server:8080
      ONYX_API_KEY: ${ONYX_API_KEY:-}
      DATA_DIR: /data
      MAIL_PUBLIC_URL: ${MAIL_PUBLIC_URL:-http://localhost:8081}
      ONYX_CC_PAIR_ID: ${ONYX_CC_PAIR_ID:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${DATA_DIR:-../../data}:/data:ro
    entrypoint: ["python", "/app/ingest.py"]
    depends_on:
      api_server: { condition: service_healthy }
    restart: "no"

networks:
  mailrag:
    external: true

volumes:
  db_volume:
  model_cache_huggingface:
  indexing_huggingface_model_cache:
