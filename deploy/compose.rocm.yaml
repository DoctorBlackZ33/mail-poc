# ROCm llama-server, launched by llama-swap (one project per model).
# Params arrive as LLAMA_ARGS; LLAMA_PORT is the host port llama-swap proxies to.
services:
  llama:
    image: local/llama.cpp:server-rocm
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-985}"
      - "${RENDER_GID:-989}"
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_NICE
    ipc: host
    init: true
    shm_size: "8gb"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      HIP_VISIBLE_DEVICES: "0"
      ROCR_VISIBLE_DEVICES: "0"
      HSA_ENABLE_SDMA: "1"
      OMP_NUM_THREADS: "8"
      LLAMA_ARGS: ${LLAMA_ARGS}
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    # direct exec: no shell wrapper, so SIGTERM reaches llama-server
    command: ${LLAMA_ARGS}
    ports:
      - "127.0.0.1:${LLAMA_PORT}:8080"
    stop_grace_period: 20s
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
